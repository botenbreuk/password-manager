name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: PasswordManager-linux
          - os: macos-latest
            artifact_name: PasswordManager-macos
          - os: windows-latest
            artifact_name: PasswordManager-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLCipher (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlcipher

      - name: Install SQLCipher (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsqlcipher-dev

      - name: Install SQLCipher (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install openssl:x64-windows sqlcipher:x64-windows
          echo "SQLCIPHER_LIB_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> $GITHUB_ENV
          echo "SQLCIPHER_INCLUDE_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller release/password_manager.spec --distpath dist --workpath build --noconfirm

      - name: Verify macOS dylib paths
        if: runner.os == 'macOS'
        run: |
          echo "--- Executable dependencies ---"
          otool -L dist/PasswordManager.app/Contents/MacOS/PasswordManager
          echo ""
          echo "--- Check for absolute paths in dylibs ---"
          find dist/PasswordManager.app -name "*.dylib" -exec sh -c 'echo "=== $1 ===" && otool -L "$1" | grep -v "@" | grep -v "/usr/lib" | grep -v "/System" || true' _ {} \; 2>&1 | head -50

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/PasswordManager.app

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PasswordManager.app dist/PasswordManager-macos.zip

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PasswordManager-macos.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PasswordManager

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PasswordManager.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/PasswordManager-macos/PasswordManager-macos.zip
            artifacts/PasswordManager-linux/PasswordManager
            artifacts/PasswordManager-windows/PasswordManager.exe
